spring:
  application:
    name: CropGuard
  datasource:
    url: jdbc:h2:mem:cropguard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

cropguard:
  jwt-secret: cropguard-dev-secret-key-must-be-at-least-32-characters-long-for-hs256
  jwt-expiration-seconds: 86400
  app-name: CropGuard
  legacy-import:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
