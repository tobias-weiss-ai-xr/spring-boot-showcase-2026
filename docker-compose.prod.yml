# Production stack for the graphwiz.ai edge host (traefik fronts it).
# Backend stays internal — the SPA's nginx proxies /api to it.
# Frontend is published on loopback only; traefik routes the domain to it
# (router block in /root/git/docker-traefik/dynamic/routers.yml on the host).
services:
  backend:
    image: cropguard-backend:latest
    expose:
      - "8080"
    environment:
      # persistent H2 file DB on a volume (dev stays in-memory via application.yml)
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/data/cropguard;DB_CLOSE_DELAY=-1"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
    volumes:
      - cropguard-data:/data
    restart: unless-stopped
  frontend:
    image: cropguard-frontend:latest
    ports:
      - "127.0.0.1:3011:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cropguard-data:
