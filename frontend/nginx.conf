server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client routes (/farmer, /assessor, /login, …)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + actuator → backend container (mirrors the dev proxy)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /v3/api-docs/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}
